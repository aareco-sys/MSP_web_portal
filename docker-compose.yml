# Correr la app igual que en AWS (una sola imagen Next.js).
# DinoCloud Internal - Confidential
#   cp .env.example .env  # y completar CLICKUP_TOKEN
#   docker compose up --build
services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
